<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For วราจัง 🤍</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4);
      padding:10px;
    }

    .escape-area{
    position: relative;
    padding: 100px;        /* ← ระยะรอบกรอบสีขาว (ตรงกับที่คุณวง) */
    margin: -100px;
    }

    .card{
      background:#fff;
      border-radius:24px;
      padding:clamp(15px, 4vw, 20px);
      width:100%;
      max-width:min(360px, 90vw);
      text-align:center;
      box-shadow:0 20px 40px rgba(0,0,0,.15);
      animation:float 4s ease-in-out infinite;
      position:relative;
      z-index:3;
      max-height:90vh;
      overflow-y:auto;
      scroll-behavior:smooth;
    }
    
    /* ปิด overflow สำหรับหน้าคำถาม */
    .card#question{
      overflow:visible !important;
    }
    
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }

    h1{
      font-size:clamp(1.2rem, 5vw, 1.4rem);
      color:#ff4d6d;
      margin:10px 0;
    }
    
    p{
      color:#555;
      line-height:1.8;
      margin:10px 0;
      font-size:clamp(0.9rem, 3.5vw, 1rem);
    }

    button{
      background:#ff4d6d;
      border:none;
      border-radius:999px;
      padding:clamp(10px, 3vw, 12px) clamp(16px, 5vw, 20px);
      color:#fff;
      font-size:clamp(0.9rem, 3.5vw, 1rem);
      cursor:pointer;
      margin:6px;
      touch-action:manipulation;
    }

    .photo-main{
      width:100%;
      max-height:250px;
      border-radius:18px;
      margin-bottom:12px;
      object-fit:contain;
      background:#f9f9f9;
    }

    .confess{
      max-height:clamp(200px, 40vh, 280px);
      overflow-y:auto;
      text-align:left;
      padding:10px;
      margin:10px 0;
      line-height:1.8;
      font-size:clamp(0.85rem, 3.2vw, 0.95rem);
    }

    /* Scrollbar สวยขึ้น */
    .confess::-webkit-scrollbar,
    .card::-webkit-scrollbar {
      width: 4px;
    }
    .confess::-webkit-scrollbar-track,
    .card::-webkit-scrollbar-track {
      background: transparent;
      margin: 4px 0;
    }
    .confess::-webkit-scrollbar-thumb,
    .card::-webkit-scrollbar-thumb {
      background: rgba(255, 154, 158, 0.5);
      border-radius: 10px;
    }
    .confess::-webkit-scrollbar-thumb:hover,
    .card::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 154, 158, 0.8);
    }

    /* ===== รูปลอย (ลูป) ===== */
    .floating-photo{
      position:fixed;
      bottom:-120px;
      width:clamp(80px, 15vw, 110px);
      border-radius:16px;
      opacity:0;
      animation:floatUp 10s linear forwards;
      pointer-events:none;
      z-index:1;
    }
    @keyframes floatUp{
      0%{transform:translateY(0) scale(0.9);opacity:0}
      10%{opacity:0.8}
      80%{opacity:0.6}
      100%{transform:translateY(-120vh) scale(1.05);opacity:0}
    }

    /* ===== พลุแบบใหม่ - สมจริงกว่า ===== */
    .rocket{
      position:fixed;
      bottom:0;
      width:3px;height:15px;
      background:linear-gradient(180deg, #fff, #ffeb3b);
      box-shadow:0 0 10px #fff, 0 0 20px #ffeb3b;
      animation:launch 1s ease-out forwards;
      z-index:1;
    }
    .rocket::after{
      content:'';
      position:absolute;
      bottom:-8px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:3px solid transparent;
      border-right:3px solid transparent;
      border-top:8px solid #ff6b35;
      filter:blur(1px);
    }
    @keyframes launch{
      0%{transform:translateY(0) scale(1);opacity:1}
      100%{transform:translateY(-65vh) scale(0.8);opacity:0.3}
    }

    /* พลุระเบิดแบบต่างๆ */
    .spark{
      position:fixed;
      width:3px;height:3px;
      border-radius:50%;
      pointer-events:none;
      z-index:1;
    }
    
    .spark.star{
      animation:sparkStar 1.5s ease-out forwards;
      box-shadow:0 0 4px currentColor, 0 0 8px currentColor;
    }
    @keyframes sparkStar{
      0%{transform:translate(0,0) scale(1.5);opacity:1}
      100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
    }

    .spark.circle{
      animation:sparkCircle 1.8s ease-out forwards;
      width:4px;height:4px;
      box-shadow:0 0 6px currentColor;
    }
    @keyframes sparkCircle{
      0%{transform:translate(0,0) scale(1);opacity:1}
      50%{opacity:0.8}
      100%{transform:translate(var(--x),var(--y)) scale(0.5);opacity:0}
    }

    .spark.willow{
      width:2px;height:20px;
      border-radius:2px;
      animation:sparkWillow 2s ease-out forwards;
      box-shadow:0 0 3px currentColor;
    }
    @keyframes sparkWillow{
      0%{transform:translate(0,0) rotate(var(--rot));opacity:1}
      100%{transform:translate(var(--x),calc(var(--y) + 100px)) rotate(calc(var(--rot) + 90deg));opacity:0}
    }

    .spark.heart{
      width:6px;height:6px;
      animation:sparkHeart 2s ease-out forwards;
    }
    @keyframes sparkHeart{
      0%{transform:translate(0,0) scale(1.2);opacity:1}
      100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
    }

    /* ===== หัวใจลอย (ลูป) ===== */
    .floating-heart{
      position:fixed;
      bottom:-60px;
      font-size:clamp(20px, 5vw, 30px);
      opacity:0;
      animation:heartFloat 8s ease-in forwards;
      pointer-events:none;
      z-index:2;
    }
    @keyframes heartFloat{
      0%{transform:translateY(0) rotate(0deg);opacity:0}
      10%{opacity:0.9}
      70%{opacity:0.8}
      100%{transform:translateY(-120vh) rotate(360deg);opacity:0}
    }

    .shake{animation:shake .4s}
    @keyframes shake{
      0%{transform:translateX(0)}
      25%{transform:translateX(-5px)}
      50%{transform:translateX(5px)}
      75%{transform:translateX(-5px)}
      100%{transform:translateX(0)}
    }

    /* ปุ่มอยู่ข้างๆกัน */
    .btn-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:20px;
      position:relative;
      min-height:60px;
    }
    
    #noBtn{
      transition:all 0.15s ease;
    }
    
    /* Responsive สำหรับหน้าจอเล็ก */
    @media (max-width: 480px) {
      .card {
        padding: 15px;
        max-width: 95vw;
      }
      
      .photo-main {
        max-height: 200px;
      }
    }
    
    /* สำหรับหน้าจอใหญ่ */
    @media (min-width: 768px) {
      .card {
        max-width: 400px;
      }
      
      .photo-main {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>

<!-- หน้าแรก -->
<div class="card" id="home">
  <img src="assets/7.jpg" class="photo-main">
  <h1>ถึง Waralak Inteim 💕</h1>
  <p>เค้ามีอะไรอยากบอกเธอ…</p>
  <button onclick="openLetter()">อ่านจดหมาย 💌</button>
</div>

<!-- หน้าสารภาพใจ -->
<div class="card" id="letter" style="display:none">
  <h1>จากใจของเค้า 💗</h1>
  <img src="assets/2.jpg" class="photo-main">
  <div class="confess" id="confess"></div>
  <button onclick="goQuestion()">อ่านจบแล้ว 👉</button>
</div>

<!-- หน้าคำถาม -->
<div class="card" id="question" style="display:none">
  <div class="escape-area" id="escapeArea">
    <h1>เป็นแฟนกันไหม 💕</h1>
    <div class="btn-wrap">
      <button id="yesBtn" onclick="yesAnswer()">เป็น 💖</button>
      <button id="noBtn">ไม่เป็น 😔</button>
    </div>
  </div>
</div>

<!-- หน้าปิดท้าย -->
<div class="card" id="final" style="display:none">
  <img src="assets/18.jpg" class="photo-main">
  <p id="finalText"></p>
</div>

<audio id="music"><source src="assets/music.mp3" type="audio/mpeg"></audio>

<script>
const loveText=`เธอเป็นคนที่น่ารักสดใสมากๆ ดูร่าเริงตลอดเวลา ✨
เห็นเธอมีความสุข ก็มีความสุขตามไปด้วย

ชอบทำตัวเหมือนเด็กน้อยขี้อ้อนขี้เล่น 
เป็นคนที่เข้ามาทำให้เปลี่ยนจากเป็นปลาตาย 1 ปี เหลือ 1 เดือน 55555

ทำให้หัดยิ้มมากขึ้น ยิ้มเป็น 
ทำให้โลกของผมนั้นสดใสสุดๆ ฟุดๆ ไปเบย

เธอเป็นคนที่ใส่ใจเอามากๆ 
เธอจะชอบโน๊ตเรื่องราวของเราเก็บเอาไว้ทุกเรื่อง

เป็นคนที่ใช่ตั้งแต่แรกพบ 
ผมหลงเสน่ห์รอยยิ้มและดวงตาที่น่ารักสดใสของเธอ
ไม่สามารถหยุดมองมันได้เลย

เมื่อมองที่ไร ก็ทำให้ผมนั้นหลุดยิ้มออกมาได้ตลอด 
และเป็นคนแรกที่ผมคิดว่า คนนี้แหละคือคนที่ผมอยากใช้ชีวิตไปกับเธอ

ผมคิดถึงอนาคต วางแผน 
คิดเรื่องงานแต่ง คิดเรื่องที่อยากจะมีลูกด้วยกัน
ถ้าได้มีบีมในเวอร์ชั่นที่ตัวเล็ก ก็น่าจะดีนะ 

ความคิดเหล่านี้ผมไม่เคยจะคิดถึงมันเลย จนได้มาพบเธอ 

อยากไปเที่ยวด้วยกันเยอะๆ 
หาของอร่อยๆ กินกันเยอะๆ 
ถ่ายรูปด้วยกันเยอะๆ 
หากิจกรรมทำร่วมกันเยอะๆ

ผมเป็นคนที่ติดห้องมาก ไม่ค่อยอยากออกไปไหนทำอะไร
อยู่ห้องก็แค่สั่งข้าว 

แต่พอมีเธอยู่ในชีวิต ผมก็ต้องคิดมากขึ้น วางแผนมากขึ้น
มันเป็นเรื่องดีนะ การได้ออกไปใช้ชีวิตด้วยกัน 🌸

นี่ก็คืออีกเรื่องที่เธอเข้ามาทำให้ผมเปลี่ยนแปลงในทางที่ดี
และก็คิดว่าคนนี้แหละจะเป็นคนที่จะเดินทางร่วมกันไปตลอด

เค้าอยากให้เธอเป็นคนที่เดินไปด้วยกันตลอดไป ❤️`;

let i=0;

function typeConfess(){
  const box=document.getElementById('confess');
  if(i<loveText.length){
    box.innerHTML+=loveText[i]==='\n'?'<br>':loveText[i];
    i++;
    
    if(i % 5 === 0) {
      box.scrollTo({
        top: box.scrollHeight,
        behavior: 'smooth'
      });
    }
    
    setTimeout(typeConfess, 50);
  } else {
    setTimeout(() => {
      box.scrollTo({
        top: box.scrollHeight,
        behavior: 'smooth'
      });
    }, 100);
  }
}

function openLetter(){
  home.style.display='none';
  letter.style.display='block';
  i = 0;
  typeConfess();
}

function goQuestion(){
  letter.style.display='none';
  question.style.display='block';
}

const noBtn=document.getElementById('noBtn');

// ปุ่มหนีไปรอบๆ กรอบสีขาว 
noBtn.addEventListener('mouseover',runAway);
noBtn.addEventListener('touchstart',runAway);

function runAway(e){
  e.preventDefault();

  const area = document.getElementById('escapeArea');
  const btn = noBtn;

  area.classList.add('shake');
  setTimeout(()=>area.classList.remove('shake'),300);

  const areaRect = area.getBoundingClientRect();

  const maxX = area.clientWidth - btn.offsetWidth;
  const maxY = area.clientHeight - btn.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  btn.style.position = 'absolute';
  btn.style.left = `${x}px`;
  btn.style.top = `${y}px`;
  btn.style.margin = '0';
}

/* ===== รูปลอยหลายรูป (ลูป) ===== */
const floatingImages = [
  'assets/0.jpg','assets/1.jpg','assets/2.jpg','assets/3.jpg','assets/4.jpg',
  'assets/5.jpg','assets/6.jpg','assets/7.jpg','assets/8.jpg','assets/9.jpg',
  'assets/10.jpg','assets/11.jpg','assets/12.jpg','assets/13.jpg','assets/14.jpg',
  'assets/15.jpg','assets/16.jpg','assets/17.jpg','assets/18.jpg','assets/19.jpg',
  'assets/20.jpg','assets/21.jpg','assets/22.jpg','assets/23.jpg','assets/24.jpg',
  'assets/25.jpg','assets/26.jpg','assets/27.jpg','assets/28.jpg','assets/29.jpg',
  'assets/30.jpg','assets/31.jpg','assets/32.jpg','assets/33.jpg',
  'assets/34.jpg','assets/35.jpg','assets/36.jpg','assets/37.jpg','assets/38.jpg',
  'assets/39.jpg','assets/40.jpg','assets/41.jpg','assets/42.jpg','assets/43.jpg',
  'assets/44.jpg','assets/45.jpg','assets/46.jpg','assets/47.jpg','assets/48.jpg',
  'assets/49.jpg','assets/50.jpg','assets/51.jpg','assets/52.jpg','assets/53.jpg',
  'assets/54.jpg','assets/55.jpg'
];

function startFloatingPhotos(){
  setInterval(()=>{
    const img=document.createElement('img');
    img.src=floatingImages[Math.floor(Math.random()*floatingImages.length)];
    img.className='floating-photo';
    img.style.left=Math.random()*window.innerWidth+'px';
    img.style.animationDuration=8+Math.random()*4+'s';
    document.body.appendChild(img);
    setTimeout(()=>img.remove(),12000);
  },600);
}

/* ===== หัวใจลอย (ลูป) ===== */
function startFloatingHearts(){
  const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝', '💘', '🤍'];
  setInterval(()=>{
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left = Math.random()*window.innerWidth+'px';
    heart.style.fontSize = (25 + Math.random()*20)+'px';
    heart.style.animationDuration = (6 + Math.random()*4)+'s';
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
  },400);
}

/* ===== พลุแบบสมจริง (ลูป) ===== */
function startFireworks(){
  setInterval(()=>{
    const types = ['star', 'circle', 'willow', 'heart'];
    const type = types[Math.floor(Math.random()*types.length)];
    launchRocket(type);
  },800);
}

function launchRocket(type){
  const rocket=document.createElement('div');
  rocket.className='rocket';
  const x=Math.random()*window.innerWidth;
  rocket.style.left=x+'px';
  document.body.appendChild(rocket);

  setTimeout(()=>{
    rocket.remove();
    const y = window.innerHeight*0.2 + Math.random()*window.innerHeight*0.3;
    explodeFirework(x, y, type);
  },1000);
}

function explodeFirework(x, y, type){
  const colors = [
    '#ff006e', '#fb5607', '#ffbe0b', '#8338ec', '#3a86ff',
    '#06ffa5', '#ff006e', '#f72585', '#4cc9f0', '#4361ee'
  ];
  
  let particleCount;
  
  switch(type){
    case 'star':
      particleCount = 50;
      for(let i = 0; i < particleCount; i++){
        const p = document.createElement('div');
        p.className = 'spark star';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        const angle = (Math.PI * 2 * i) / particleCount;
        const speed = 150 + Math.random() * 100;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;
        p.style.setProperty('--x', dx + 'px');
        p.style.setProperty('--y', dy + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
      }
      break;
      
    case 'circle':
      particleCount = 60;
      for(let i = 0; i < particleCount; i++){
        const p = document.createElement('div');
        p.className = 'spark circle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[Math.floor(Math.random()*colors.length)];
        const angle = (Math.PI * 2 * i) / particleCount;
        const speed = 200 + Math.random() * 50;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed;
        p.style.setProperty('--x', dx + 'px');
        p.style.setProperty('--y', dy + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1800);
      }
      break;
      
    case 'willow':
      particleCount = 40;
      const mainColor = colors[Math.floor(Math.random()*colors.length)];
      for(let i = 0; i < particleCount; i++){
        const p = document.createElement('div');
        p.className = 'spark willow';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = mainColor;
        const angle = (Math.PI * 2 * i) / particleCount;
        const speed = 150 + Math.random() * 80;
        const dx = Math.cos(angle) * speed;
        const dy = Math.sin(angle) * speed - 50;
        p.style.setProperty('--x', dx + 'px');
        p.style.setProperty('--y', dy + 'px');
        p.style.setProperty('--rot', Math.random() * 360 + 'deg');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2000);
      }
      break;
      
    case 'heart':
      particleCount = 30;
      const heartColor = '#ff006e';
      for(let i = 0; i < particleCount; i++){
        const p = document.createElement('div');
        p.className = 'spark heart';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = heartColor;
        p.innerHTML = '💕';
        p.style.fontSize = '12px';
        const t = (i / particleCount) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        p.style.setProperty('--x', hx * 15 + 'px');
        p.style.setProperty('--y', hy * 15 + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 2000);
      }
      break;
  }
}

function yesAnswer(){
  question.style.display='none';
  final.style.display='block';
  const audio=document.getElementById('music');
  if(audio) audio.play().catch(()=>{});

  const ending=`สุขสันต์วันเกิดและวันวาเลนไทน์นะและวันนี้จะเป็นวันครบรอบของเราด้วย 💖
เค้าอยากให้เธอรู้ว่าเธอคือคนสำคัญที่สุด เป็นเหมือนโลกทั้งใบของเค้า

ขอให้ทุกวันของเธอเต็มไปด้วยรอยยิ้ม
เสียงหัวเราะ และความสุขเล็กๆ รอบตัว

เค้าจะอยู่ข้างๆ คอยดูแล คอยซัพพอร์ต
และคอยรักเธอแบบนี้ไปทุกวันเลยนะ`;

  let j=0;
  const box=document.getElementById('finalText');
  box.innerHTML='';
  
  function typeEnd(){
    if(j<ending.length){
      box.innerHTML+=ending[j]==='\n'?'<br>':ending[j];
      j++;
      
      if(j % 5 === 0) {
        final.scrollTo({
          top: final.scrollHeight,
          behavior: 'smooth'
        });
      }
      
      setTimeout(typeEnd, 80);
    } else {
      setTimeout(() => {
        final.scrollTo({
          top: final.scrollHeight,
          behavior: 'smooth'
        });
      }, 100);
    }
  }
  typeEnd();

  startFloatingPhotos();
  startFloatingHearts();
  startFireworks();
}
</script>
</body>
</html>
